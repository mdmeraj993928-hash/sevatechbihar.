  const SUPABASE_ANON_KEY = "sb_publishable_D2f7ZHyv9IPAjTSaKjubkA_phNP8EoF";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.sevaDB = {
    async load() {
      const { data, error } = await supabase
        .from("site_data")
        .select("value")
        .eq("key", "posts")
        .maybeSingle();
      if (error) throw error;
      return data ? data.value : null;
    },
    async save(list) {
      const { error } = await supabase
        .from("site_data")
        .upsert({ key: "posts", value: list });
      if (error) throw error;
    },
  };

function formatDate(iso) {
  try {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("hi-IN", { day: "2-digit", month: "short", year: "numeric" });
  } catch { return iso; }
}
function daysLeft(iso) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

        </div>

}

const emptyForm = { title:"", category:"", image:"", excerpt:"", posts:"", qualification:"", lastDate:"", applyLink:"", officialLink:"" };

function AdminDashboard({ posts, persist, onLogout, saving }) {
  const [form, setForm] = useState(emptyForm);
  const [editingId, setEditingId] = useState(null);
  const [formOpen, setFormOpen] = useState(false);

  function startAdd() { setForm(emptyForm); setEditingId(null); setFormOpen(true); }
  function startEdit(post) {
    setForm({ title:post.title, category:post.category, image:post.image, excerpt:post.excerpt,
      posts:post.posts, qualification:post.qualification, lastDate:post.lastDate,
      applyLink:post.applyLink, officialLink:post.officialLink });
    setEditingId(post.id); setFormOpen(true);
  }
  async function handleSave(e) {
    e.preventDefault();
    if (editingId) { await persist(posts.map(p => p.id===editingId ? {...p, ...form} : p)); }
    else { await persist([{ ...form, id:"post-"+Date.now(), date:new Date().toISOString().slice(0,10) }, ...posts]); }
    setFormOpen(false); setForm(emptyForm); setEditingId(null);
  }
  async function handleDelete(id) { await persist(posts.filter(p => p.id !== id)); }

  return (
    <div className="pt-6">
      <div className="flex items-center justify-between mb-5">
        <div><h1 className="font-display font-extrabold text-xl">Admin Dashboard</h1>
          <p className="text-xs text-[#9AA1B4]">{posts.length} पोस्ट प्रकाशित {saving && "· सेव हो रहा है..."}</p></div>
        <button onClick={onLogout} className="flex items-center gap-1.5 text-xs font-medium border border-[#E7DFCB] px-3 py-2 rounded-lg"><IconLogOut className="w-3.5 h-3.5" /> Logout</button>
      </div>
      {!formOpen && <button onClick={startAdd} className="w-full flex items-center justify-center gap-2 bg-[#E8890C] text-white font-semibold py-3 rounded-xl mb-6"><IconPlus className="w-4 h-4" /> नई भर्ती जोड़ें</button>}
      {formOpen && (
        <form onSubmit={handleSave} className="bg-white border border-[#E7DFCB] rounded-2xl p-5 mb-6 space-y-3">
          <h2 className="font-display font-bold text-sm flex items-center gap-1.5"><IconImage className="w-4 h-4 text-[#E8890C]" /> {editingId ? "पोस्ट संपादित करें" : "नई पोस्ट"}</h2>
          {["title","category","image"].map(f => (
            <div key={f}><label className="text-xs font-medium text-[#5B6478]">{f==="title"?"शीर्षक":f==="category"?"विभाग":"Image URL"}</label>
              <input value={form[f]} required={f==="title"} onChange={e=>setForm(x=>({...x,[f]:e.target.value}))} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
          ))}
          <div><label className="text-xs font-medium text-[#5B6478]">विवरण</label>
            <textarea value={form.excerpt} onChange={e=>setForm(x=>({...x,excerpt:e.target.value}))} rows={3} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs font-medium text-[#5B6478]">कुल पद</label><input value={form.posts} onChange={e=>setForm(x=>({...x,posts:e.target.value}))} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
            <div><label className="text-xs font-medium text-[#5B6478]">योग्यता</label><input value={form.qualification} onChange={e=>setForm(x=>({...x,qualification:e.target.value}))} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
          </div>
          <div><label className="text-xs font-medium text-[#5B6478]">अंतिम तिथि</label><input type="date" value={form.lastDate} onChange={e=>setForm(x=>({...x,lastDate:e.target.value}))} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
          <div><label className="text-xs font-medium text-[#5B6478]">Apply Link</label><input value={form.applyLink} onChange={e=>setForm(x=>({...x,applyLink:e.target.value}))} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
          <div><label className="text-xs font-medium text-[#5B6478]">Official Link</label><input value={form.officialLink} onChange={e=>setForm(x=>({...x,officialLink:e.target.value}))} className="mt-1 w-full border border-[#E7DFCB] rounded-lg px-3 py-2 text-sm" /></div>
          <div className="flex gap-2 pt-2">
            <button type="submit" className="flex-1 bg-[#16233F] text-white font-semibold py-2.5 rounded-lg text-sm">{editingId ? "बदलाव सेव करें" : "पोस्ट प्रकाशित करें"}</button>
            <button type="button" onClick={()=>{setFormOpen(false);setEditingId(null);}} className="px-4 border border-[#E7DFCB] rounded-lg text-sm font-medium">Cancel</button>
          </div>
        </form>
      )}
      <div className="space-y-2">
        {posts.map(post => (
          <div key={post.id} className="flex items-center gap-3 bg-white border border-[#E7DFCB] rounded-xl p-3">
            <img src={post.image} alt="" className="w-14 h-14 rounded-lg object-cover bg-[#EFE8D6] shrink-0" />
            <div className="flex-1 min-w-0"><div className="text-sm font-semibold truncate">{post.title}</div><div className="text-[11px] text-[#9AA1B4]">{post.category} · {formatDate(post.lastDate)}</div></div>
            <button onClick={()=>startEdit(post)} className="w-8 h-8 flex items-center justify-center rounded-lg border border-[#E7DFCB]"><IconPencil className="w-3.5 h-3.5" /></button>
            <button onClick={()=>handleDelete(post.id)} className="w-8 h-8 flex items-center justify-center rounded-lg border border-[#E7DFCB]"><IconTrash className="w-3.5 h-3.5" /></button>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
